[project]
name = "theoros"
version = "0.1.0"
description = "theoros using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.44,<2.0.0",
    "crewai[tools,litellm]==1.10.1",
    "wikipedia"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "c49bcf0d-bfbf-4267-b56e-411598783c0b"
